server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/wasm image/svg+xml text/css;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Revalidar después de desplegar para no mezclar versiones de la app.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Un asset inexistente no debe responder con el HTML de la aplicación.
    location ~* \.(?:js|wasm|json|css|png|jpg|jpeg|svg|ico|ttf|otf|woff2?|bin)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
